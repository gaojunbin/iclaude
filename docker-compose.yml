name: iclaude

services:
  iclaude:
    image: iclaude:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        III_VERSION: "0.11.2"
    restart: unless-stopped
    environment:
      - AGENTMEMORY_DATA_DIR=/data
      - AGENTMEMORY_TOOLS=${AGENTMEMORY_TOOLS:-all}
      - AGENTMEMORY_VIEWER_HOST=0.0.0.0
      - VIEWER_ALLOWED_HOSTS=*
      - AGENTMEMORY_AUTO_COMPRESS=${AGENTMEMORY_AUTO_COMPRESS:-true}
      - AGENTMEMORY_INJECT_CONTEXT=${AGENTMEMORY_INJECT_CONTEXT:-true}
      - CONSOLIDATION_ENABLED=${CONSOLIDATION_ENABLED:-true}
      - GRAPH_EXTRACTION_ENABLED=${GRAPH_EXTRACTION_ENABLED:-true}

      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_MODEL
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - OPENROUTER_API_KEY
      - MINIMAX_API_KEY
      - VOYAGE_API_KEY
      - COHERE_API_KEY
    expose:
      - "3111"
      - "3113"
    ports:
      - "0.0.0.0:3111:3111"
      - "0.0.0.0:3113:3113"
    volumes:
      - iclaude-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  iclaude-data:
